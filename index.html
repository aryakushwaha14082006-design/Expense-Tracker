<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Website ki basic settings -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Browser tab ka title -->
    <title>Expense Tracker</title>

    <!-- CSS file connect karna -->
    <link rel="stylesheet" href="style.css">

    <!-- JavaScript file connect karna -->
    <script src="script.js" defer></script>
</head>

<body>

    <!-- Website ka header -->
    <header>
        <h1>Expense Tracker 💰</h1>
        <p>Manage your money smartly!</p>
    </header>

    <!-- Main content -->
    <main class="container">

        <!-- Total balance section -->
        <section class="balance">
            <h3>Total Balance</h3>
            <h2 id="balance-amount">₹0.00</h2>
        </section>

        <!-- Income aur expenses ka summary -->
        <section class="summary">

            <!-- Total income -->
            <div class="summary-card income-card">
                <h3>Total Income</h3>
                <p id="income-total">₹0.00</p>
            </div>

            <!-- Total expenses -->
            <div class="summary-card expense-card">
                <h3>Total Expenses</h3>
                <p id="expenses-total">₹0.00</p>
            </div>

        </section>

        <!-- Naya transaction add karne ka form -->
        <section class="form-section">

            <h2>Add New Transaction</h2>

            <form id="transaction-form">

                <!-- Transaction ka naam -->
                <label for="transaction-name">
                    Transaction Name
                </label>

                <input
                    type="text"
                    id="transaction-name"
                    placeholder="e.g. Salary, Petrol"
                    required
                >

                <!-- Transaction ki amount -->
                <label for="transaction-amount">
                    Amount (₹)
                </label>

                <input
                    type="number"
                    id="transaction-amount"
                    placeholder="Enter amount"
                    min="0.01"
                    step="0.01"
                    required
                >

                <!-- Income ya expense select karna -->
                <label for="transaction-type">
                    Transaction Type
                </label>

                <select id="transaction-type">
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>

                <!-- Form submit button -->
                <button type="submit" id="add-transaction">
                    + Add Transaction
                </button>

            </form>

        </section>

        <!-- Transaction history -->
        <section class="history-section">

            <h2>Transaction History</h2>

            <!-- JavaScript yahan transactions dikhayega -->
            <div id="transaction-list">
                <p class="empty-message">No transactions yet.</p>
            </div>

        </section>

    </main>

    <!-- Website ka footer -->
    <footer>
        <p>Expense Tracker | Built with HTML, CSS & JavaScript</p>
    </footer>

</body>
</html>
